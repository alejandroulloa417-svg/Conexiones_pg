<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ubicación del paciente - ARKA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8fc;
            margin: 0;
            padding: 40px;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #174a7e;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .autorizacion {
            width: auto;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Ubicación del paciente</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Paciente</label>
        <input type="text" name="paciente" required>

        <label>Latitud</label>
        <input type="number" step="any" name="latitud" required>

        <label>Longitud</label>
        <input type="number" step="any" name="longitud" required>

        <label>Motivo</label>
        <input type="text" name="motivo">

        <label>
            <input
                class="autorizacion"
                type="checkbox"
                name="autorizacion"
                required
            >

            Autorizo compartir mi ubicación
        </label>

        <button type="submit">
            Guardar ubicación
        </button>

    </form>

</div>

</body>

</html>
